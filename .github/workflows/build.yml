name: ns-3.48 integration
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: meshviz
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev fonts-noto-cjk
      - run: git clone --depth 1 --branch ns-3.48 https://gitlab.com/nsnam/ns-3-dev.git ns-3.48
      - run: mv meshviz ns-3.48/contrib/meshviz
      - working-directory: ns-3.48
        run: |
          python3 contrib/meshviz/tools/install.py
          ./ns3 configure -d optimized --enable-modules=meshviz,csma --enable-examples --enable-tests --filter-module-examples-and-tests=meshviz
          ./ns3 build mesh_test_obss_metrics test-runner -j 2
          cmake --build cmake-cache --target meshviz-viewer -j 2
          cmake -S contrib/meshviz/ui -B "$RUNNER_TEMP/meshviz-ui-check" -DMESHVIZ_UI_TESTS=ON
          cmake --build "$RUNNER_TEMP/meshviz-ui-check" --target meshviz-ui-test -j 2
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME=generic MESHVIZ_TEST_TRACE="$PWD/contrib/meshviz/doc/example.jsonl" "$RUNNER_TEMP/meshviz-ui-check/bin/meshviz-ui-test"
          ./ns3 run "mesh_test_obss_metrics --mode=5 --staAssoc=ap2 --trafficType=tcp --tcpStreams=1 --appRate=1Gbps --prewarm=1.5 --test=0.5 --captureDuration=0.06 --meshviz=$RUNNER_TEMP/aggregate.jsonl --out=$RUNNER_TEMP/aggregate.csv"
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME=generic MESHVIZ_TEST_TRACE="$RUNNER_TEMP/aggregate.jsonl" "$RUNNER_TEMP/meshviz-ui-check/bin/meshviz-ui-test" aggregateSelection
          python3 contrib/meshviz/test/cli-entry.py
          ./test.py --no-build -s meshviz
          python3 contrib/meshviz/test/integration.py --report validation.json
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME=generic ./build/contrib/meshviz/meshviz-viewer contrib/meshviz/doc/example.jsonl --export figures
      - uses: actions/upload-artifact@v4
        with:
          name: validation-and-figures
          path: |
            ns-3.48/validation.json
            ns-3.48/figures
